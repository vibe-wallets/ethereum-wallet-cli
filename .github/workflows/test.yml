name: Tests and published image
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: wallet-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: make format-check lint test
      - run: make test-integration
      - run: make test-docker
      - name: Save the tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save ethereum-wallet-cli:local | gzip > wallet-image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: wallet-image-${{ github.sha }}
          path: wallet-image.tar.gz
          retention-days: 2

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wallet-image-${{ github.sha }}
      - name: Select runner-temporary Docker configuration
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/wallet-registry-auth" >> "$GITHUB_ENV"
      - name: Configure temporary CI registry credentials
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/registry_auth.py --config-dir "$DOCKER_CONFIG"
      - name: Publish the tested immutable image
        id: publish
        run: |
          set -euo pipefail
          gzip -dc wallet-image.tar.gz | docker load
          candidate="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          docker tag ethereum-wallet-cli:local "$candidate"
          docker push "$candidate"
          docker pull "$candidate"
          digest=$(docker image inspect "$candidate" --format '{{index .RepoDigests 0}}')
          test -n "$digest"
          echo "image=$digest" >> "$GITHUB_OUTPUT"
      - name: Attempt to make the container package publicly readable
        id: visibility
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! output=$(gh api --method PATCH \
              "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/ethereum-wallet-cli" \
              -f visibility=public 2>&1); then
            echo "::warning::Could not set package visibility with GITHUB_TOKEN: ${output//$'\n'/ }"
            exit 1
          fi
      - name: Report package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          visibility=$(gh api \
            "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/ethereum-wallet-cli" \
            --jq .visibility)
          echo "Package visibility: $visibility"
          if [ "$visibility" != "public" ]; then
            echo "::warning::Package is $visibility; registry E2E will authenticate with the workflow token. Set it to Public in the package settings to allow anonymous pulls."
          fi
      - name: Remove temporary registry credentials
        if: always()
        run: rm -rf "$DOCKER_CONFIG"

  published-e2e:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A fresh runner with runner-temporary credentials pulls the exact digest.
    env:
      PUBLISHED_IMAGE: ${{ needs.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select runner-temporary Docker configuration
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/wallet-registry-auth" >> "$GITHUB_ENV"
      - name: Configure temporary CI registry credentials
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/registry_auth.py --config-dir "$DOCKER_CONFIG"
      - name: Report whether the image is anonymously readable
        run: |
          set -euo pipefail
          anonymous="$(mktemp -d)"
          if DOCKER_CONFIG="$anonymous" docker manifest inspect "$PUBLISHED_IMAGE" > /dev/null 2>&1; then
            echo '::notice::Published image is anonymously readable.'
          else
            echo '::warning::Published image is not anonymous; the fresh-runner pull authenticates with the workflow token.'
          fi
          rm -rf "$anonymous"
      - name: Require an uncached fresh-runner pull and exercise both wallets
        run: |
          set -euo pipefail
          if docker image inspect "$PUBLISHED_IMAGE" > /dev/null 2>&1; then
            echo 'Published image unexpectedly cached before delivery test' >&2
            exit 1
          fi
          make test-published PUBLISHED_IMAGE="$PUBLISHED_IMAGE"
      - name: Remove temporary registry credentials
        if: always()
        run: rm -rf "$DOCKER_CONFIG"

  promote:
    needs: [publish, published-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      VERIFIED_IMAGE: ${{ needs.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Select runner-temporary Docker configuration
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/wallet-registry-auth" >> "$GITHUB_ENV"
      - name: Configure temporary CI registry credentials
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/registry_auth.py --config-dir "$DOCKER_CONFIG"
      - name: Promote only the digest that passed registry E2E
        run: |
          set -euo pipefail
          docker pull "$VERIFIED_IMAGE"
          repository="${VERIFIED_IMAGE%@*}"
          for tag in main latest; do
            docker tag "$VERIFIED_IMAGE" "$repository:$tag"
            docker push "$repository:$tag"
          done
      - name: Remove temporary registry credentials
        if: always()
        run: rm -rf "$DOCKER_CONFIG"

  default-image-e2e:
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select runner-temporary Docker configuration
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/wallet-registry-auth" >> "$GITHUB_ENV"
      - name: Configure temporary CI registry credentials
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/registry_auth.py --config-dir "$DOCKER_CONFIG"
      - name: Verify the default launcher tag from a fresh runner
        run: |
          set -euo pipefail
          make test-published PUBLISHED_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:main"
      - name: Remove temporary registry credentials
        if: always()
        run: rm -rf "$DOCKER_CONFIG"
